name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  sim-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sim-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./...

  ingestion-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./...

  stream-processor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/stream-processor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  stream-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/stream-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npm test
