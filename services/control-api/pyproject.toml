[project]
name = "mimicron-control-api"
version = "0.1.0"
description = "Mimicron control plane API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "prometheus-client>=0.21.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.2.0",
  "pyjwt>=2.9.0",
  "redis>=5.1.0",
  "python-slugify>=8.0.0",
  "aiokafka>=0.11.0",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "testcontainers[postgres,redis]>=4.8.0",
  "pyyaml>=6.0.0",
  "types-passlib>=1.7.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/db/models.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
