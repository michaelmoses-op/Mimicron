name: mimicron

x-health-defaults: &health-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  postgres:
    profiles: [infra, services, all]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mimicron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mimicron_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mimicron}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mimicron} -d ${POSTGRES_DB:-mimicron}"]

  timescale:
    profiles: [infra, services, all]
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-mimicron}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-mimicron_dev}
      POSTGRES_DB: ${TIMESCALE_DB:-mimicron_ts}
    ports:
      - "${TIMESCALE_HOST_PORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-mimicron} -d ${TIMESCALE_DB:-mimicron_ts}"]

  redis:
    profiles: [infra, services, all]
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "redis-cli", "ping"]

  redpanda:
    profiles: [infra, services, all]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      start_period: 30s

  redpanda-console:
    profiles: [infra, all]
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

  redpanda-init:
    profiles: [infra, all]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    volumes:
      - ./infra/docker/redpanda-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # S3-compatible API locally (MinIO images unavailable on Docker Hub; RustFS implements the same API).
  object-store:
    profiles: [infra, services, all]
    image: rustfs/rustfs:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mimicron}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mimicron_dev_object_store}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_store_data:/data
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]

  object-store-init:
    profiles: [infra, all]
    image: peakcom/s5cmd:latest
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-store:9000}
      S3_BUCKET: ${S3_BUCKET:-mimicron-archives}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mimicron}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mimicron_dev_object_store}
    volumes:
      - ./infra/docker/s3-bucket-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  timescale-migrate:
    profiles: [infra, all]
    image: postgres:16-alpine
    depends_on:
      timescale:
        condition: service_healthy
    environment:
      TIMESCALE_HOST: timescale
      TIMESCALE_PORT: 5432
      TIMESCALE_USER: ${TIMESCALE_USER:-mimicron}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-mimicron_dev}
      TIMESCALE_DB: ${TIMESCALE_DB:-mimicron_ts}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./db/timescale/migrations:/migrations:ro
      - ./db/timescale/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    restart: "no"

  control-api:
    profiles: [services, all]
    build: ./services/control-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${CONTROL_API_PORT:-8000}:8000"
    environment:
      SERVICE_NAME: control-api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mimicron}:${POSTGRES_PASSWORD:-mimicron_dev}@postgres:5432/${POSTGRES_DB:-mimicron}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret-change-me}
      KAFKA_BROKERS: redpanda:9092
      TIMESCALE_URL: postgresql+asyncpg://${TIMESCALE_USER:-mimicron}:${TIMESCALE_PASSWORD:-mimicron_dev}@timescale:5432/${TIMESCALE_DB:-mimicron_ts}
      CONTRACTS_DIR: /contracts
      INGESTION_GATEWAY_URL: http://ingestion-gateway:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: control-api
    volumes:
      - ./contracts:/contracts:ro
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]

  sim-engine:
    profiles: [services, all]
    build: ./services/sim-engine
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      ingestion-gateway:
        condition: service_healthy
    environment:
      SERVICE_NAME: sim-engine
      HTTP_ADDR: ":8090"
      KAFKA_BROKERS: redpanda:9092
      INGESTION_URL: http://ingestion-gateway:8081
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-store:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-mimicron-archives}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mimicron}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mimicron_dev_object_store}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8090/healthz"]

  ingestion-gateway:
    profiles: [services, all]
    build: ./services/ingestion-gateway
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      control-api:
        condition: service_healthy
    ports:
      - "${INGESTION_GATEWAY_PORT:-8081}:8081"
    environment:
      SERVICE_NAME: ingestion-gateway
      HTTP_ADDR: ":8081"
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      CONTROL_API_URL: http://control-api:8000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret-change-me}
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/healthz"]

  stream-processor:
    profiles: [services, all]
    build: ./services/stream-processor
    depends_on:
      timescale:
        condition: service_healthy
      timescale-migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      SERVICE_NAME: stream-processor
      HTTP_ADDR: "0.0.0.0:8091"
      KAFKA_BROKERS: redpanda:9092
      TIMESCALE_URL: postgres://${TIMESCALE_USER:-mimicron}:${TIMESCALE_PASSWORD:-mimicron_dev}@timescale:5432/${TIMESCALE_DB:-mimicron_ts}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://object-store:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-mimicron-archives}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mimicron}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mimicron_dev_object_store}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8091/healthz"]

  stream-gateway:
    profiles: [services, all]
    build: ./services/stream-gateway
    depends_on:
      control-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    ports:
      - "${STREAM_GATEWAY_PORT:-8082}:8082"
    environment:
      SERVICE_NAME: stream-gateway
      PORT: "8082"
      KAFKA_BROKERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      REDIS_URL: redis://redis:6379/0
      CONTROL_API_URL: http://control-api:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-internal-secret-change-me}

  dashboard:
    profiles: [services, all]
    build:
      context: ./dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_STREAM_URL: ${VITE_STREAM_URL:-http://localhost:8082}
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      - control-api
      - stream-gateway
    healthcheck:
      <<: *health-defaults
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]

  prometheus:
    profiles: [observability, all]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - control-api
      - ingestion-gateway

  grafana:
    profiles: [observability, all]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  jaeger:
    profiles: [observability, all]
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  otel-collector:
    profiles: [observability, all]
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

volumes:
  postgres_data:
  timescale_data:
  object_store_data:
