global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: control-api
    metrics_path: /metrics
    static_configs:
      - targets: ["control-api:8000"]
        labels:
          service: control-api

  - job_name: ingestion-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion-gateway:8081"]
        labels:
          service: ingestion-gateway

  - job_name: stream-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["stream-gateway:8082"]
        labels:
          service: stream-gateway

  - job_name: sim-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["sim-engine:8090"]
        labels:
          service: sim-engine

  - job_name: stream-processor
    metrics_path: /metrics
    static_configs:
      - targets: ["stream-processor:8091"]
        labels:
          service: stream-processor
