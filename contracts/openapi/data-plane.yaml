openapi: 3.1.0
info:
  title: Mimicron Data Plane (Ingestion Gateway + Stream Gateway)
  version: 0.1.0
  description: |
    Two separate services described in one file.
    - **ingestion-gateway** (Go, :8081): `POST /v1/ingest`
    - **stream-gateway** (Express/TS, :8082): `GET /v1/stream` (SSE); WebSocket is a later addition
    Auth: `Authorization: Bearer <api key | run token>` or `X-API-Key`. The stream gateway also accepts `?token=` (stream token from control-api).
    The server stamps `tenant_id` and `ingest_time`. Any client-supplied values for those fields are ignored.

security:
  - apiKeyAuth: []
  - bearerAuth: []

paths:
  /v1/ingest:
    servers: [{ url: "http://localhost:8081", description: ingestion-gateway }]
    post:
      summary: Ingest a batch of events (max 1000 events and 5 MB per request)
      description: |
        Returns 202 when at least one event was accepted. Rejected events are listed per index, so clients can fix and resend only those.
        Dedupe key is `event_id`, so retrying an entire batch is safe.
        Requires scope `ingest`.
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string }, description: "Optional; best-effort batch-level dedupe for 10 min" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/IngestRequest" } }
      responses:
        "202":
          description: Accepted (possibly partially)
          headers:
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: "#/components/schemas/IngestResponse" } } }
        "400": { description: Malformed JSON or empty batch }
        "401": { description: Missing or invalid credentials }
        "403": { description: Missing `ingest` scope }
        "413": { description: Batch too large }
        "422": { description: All events rejected, content: { application/json: { schema: { $ref: "#/components/schemas/IngestResponse" } } } }
        "429":
          description: Rate limit or quota exceeded
          headers: { Retry-After: { schema: { type: integer } } }

  /healthz:
    servers: [{ url: "http://localhost:8081" }]
    get: { summary: Liveness (both services expose /healthz and /readyz), security: [], responses: { "200": { description: ok } } }

  /v1/stream:
    servers: [{ url: "http://localhost:8082", description: stream-gateway }]
    get:
      summary: Server-Sent Events stream of processed telemetry and anomalies for the caller's tenant
      description: |
        `Content-Type: text/event-stream`. Event names: `telemetry`, `anomaly`, `heartbeat` (every 15 s).
        Each SSE `id` is `<topic>:<partition>:<offset>`; clients may reconnect with `Last-Event-ID` for best-effort resume (bounded to the last 5 min).
        Requires scope `read`. Per-tenant limit of 20 concurrent connections.
      parameters:
        - { name: run_id, in: query, schema: { type: string, format: uuid } }
        - { name: device_id, in: query, schema: { type: string }, description: "Exact match or trailing * prefix" }
        - { name: metric, in: query, schema: { type: string }, description: "Comma-separated filter" }
        - { name: kinds, in: query, schema: { type: string, default: "telemetry,anomaly" } }
        - { name: token, in: query, schema: { type: string }, description: "Stream token alternative to headers" }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
              examples:
                telemetry:
                  value: |
                    id: telemetry.processed:3:10492
                    event: telemetry
                    data: {"event_id":"018f...","device_id":"therm-1-0007","event_time":"2026-07-01T14:03:11.250Z","data":{"temperature_c":21.4}}
        "401": { description: Unauthorized }
        "429": { description: Too many concurrent connections }

components:
  securitySchemes:
    apiKeyAuth: { type: apiKey, in: header, name: X-API-Key }
    bearerAuth: { type: http, scheme: bearer }

  schemas:
    IngestRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/Event" }
    Event:
      type: object
      required: [device_id, event_time, data]
      properties:
        schema_version: { type: integer, default: 1 }
        event_id: { type: string, description: "UUID (v7 preferred). Generated by server if omitted, but then retries are not deduplicated." }
        kind: { enum: [telemetry, traffic], default: telemetry }
        run_id: { type: [string, "null"], format: uuid }
        device_id: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
        device_type: { type: string, maxLength: 64 }
        event_time: { type: string, format: date-time, description: "Source clock. Must be within [-30 days, +5 min] of server time." }
        seq: { type: integer, minimum: 0 }
        tags: { type: object, maxProperties: 16, additionalProperties: { type: string, maxLength: 128 } }
        data:
          type: object
          maxProperties: 64
          description: "telemetry: metric -> number. traffic: {session_id, client_id, flow, method, path, status, latency_ms, bytes, region}"
          additionalProperties: true
    IngestResponse:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [index, code, message]
            properties:
              index: { type: integer }
              code: { enum: [invalid_schema, invalid_time, too_many_metrics, non_numeric_metric, invalid_device_id, unauthorized_run] }
              message: { type: string }
